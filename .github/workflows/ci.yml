name: CI

# Uncredentialed by construction (S1b-T2): no job here holds id-token: write or any AWS
# secret, so this file is safe to run on `pull_request` -- including from a fork -- for
# arbitrary PR-branch code. Anything that needs AWS credentials belongs in deploy.yml, on
# push to main, never here. No `paths:` filter on any trigger (F18): a required check on a
# path-filtered workflow leaves a docs-only PR pending forever with no way to fix it from
# inside the PR. No job below carries a `name:` override, for the same F18 reason -- the
# check-run name GitHub matches against a required-checks list is the job id.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tofu-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - run: tofu fmt -check -recursive

  # Covers bootstrap/ as well as environments/ai-lab -- BR-D1 keeps CI from *applying*
  # bootstrap/, not from *checking* it, and bootstrap/ holds F1/F2, the two worst findings
  # in the repo. -backend=false needs no AWS credentials (CLAUDE.md's Local: OpenTofu
  # section), which is what makes this job safe to run uncredentialed on a fork PR.
  # ⚠️ ONE job, not a matrix: GitHub names a matrix job's check runs
  # `tofu-validate (environments/ai-lab)` / `tofu-validate (bootstrap)`, never the bare
  # `tofu-validate` T7 will require -- a matrix here would plant the exact `name:`-override
  # deadlock this file's own header warns about, just via a different mechanism.
  tofu-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - name: environments/ai-lab
        working-directory: environments/ai-lab
        run: |
          set -euo pipefail
          tofu init -backend=false
          tofu validate
      # !cancelled() rather than the default success(): a single job means an
      # environments/ai-lab validate error would otherwise skip this step and hide a
      # concurrent bootstrap error until the first is fixed and re-pushed.
      - name: bootstrap
        if: '!cancelled()'
        working-directory: bootstrap
        run: |
          set -euo pipefail
          tofu init -backend=false
          tofu validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      # --recursive changes into each target directory before it looks for a config file,
      # and does not walk up to find the repo root's .tflint.hcl from there (measured
      # locally: bootstrap/ and modules/ pick up neither the aws plugin nor the two
      # disabled rules without this). An explicit --config makes every directory resolve
      # the same root file tflint --init already installed the aws plugin for.
      # GITHUB_TOKEN on --init: plugin install pulls the release anonymously from the
      # GitHub API otherwise, which can hit a shared-runner-IP rate limit -- harmless today
      # but this becomes a required check in T7, where a rate-limit flake blocks a merge.
      # contents: read is sufficient; a fork PR still gets a valid read-only token.
      - name: Install tflint plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl"

  # Carried over from deploy-ai-lab.yml's security-and-linting job (MW), which ran these
  # BEFORE assuming AWS credentials for exactly this reason: a pull_request-triggered pip
  # install is untrusted-dependency-execution surface, and it must never run with a live
  # credential available. Here it never has one to begin with. Not in T7's required list:
  # this repo has no pyproject.toml or ruff config yet (S5 adds the toolchain) -- requiring
  # a check whose config doesn't exist is the S0 deadlock in miniature. Run it, don't gate it.
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/ai-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.11'}
      - run: |
          set -euo pipefail
          pip install ruff==0.16.2 bandit==1.9.4
          ruff check .
          bandit -r .

  # F19: Checkov previously scanned modules/ only, so bootstrap/ -- which holds F1 and F2,
  # the two worst findings in the repo -- had never been scanned. directory: . covers
  # bootstrap/ + modules/ + environments/ in one pass. Reports, does not gate: this job is
  # NOT in T7's required-checks list. checkov will almost certainly fail on S3's own findings
  # (F6/F7, AOSS public network policy / missing public-access block) -- that is expected and
  # accepted (see sprint_plan.md's reassessment banner); S3 adds this to required_checks in
  # the same change that closes what it fires on. output_format: cli so the job log itself
  # (not just a SARIF artifact) shows which files under each of the three directories were
  # scanned, per this task's acceptance criterion.
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: cli

  # F59, closed 2026-08-09 -- NOT by holding this out of the required list, by removing the
  # cause. The prior job used gitleaks/gitleaks-action, which enforces a GITLEAKS_LICENSE
  # secret for any org-owned repo and hard-fails when one isn't present -- and GitHub withholds
  # every secret from a fork PR, so that job could never pass one. The license requirement is
  # gitleaks-action's own wrapper code (it calls out to api.keygen.sh), not a property of
  # gitleaks itself: the scanner is MIT-licensed and ghcr.io/gitleaks/gitleaks -- the same
  # binary, published by the same project -- carries no license gate for anyone, org-owned
  # repo or not. Invoking that image directly instead of the Action wrapper needs no secret at
  # all, so this job is now genuinely fork-PR-capable, not merely license-exempt.
  # No --log-opts restricting the scan to the PR's commit range (what gitleaks-action did):
  # full-history scan on every run instead. That range restriction is also what caused two
  # coverage gaps found during T3's /critic-gate pass -- GitHub's commits API returns only the
  # first page (30) so a >30-commit PR was under-scanned, and --no-merges --first-parent
  # skipped anything introduced on a merged side branch. A full scan has neither gap, and at
  # this repo's size the extra runtime is negligible; fetch-depth: 0 (already required) is what
  # makes the full history available to scan.
  # --redact keeps a real match's value out of the log, matching gitleaks-action's own
  # hardcoded behavior (BR-D4). Docker is available natively on ubuntu-latest runners, so no
  # setup step is needed beyond checkout.
  # Scope, verified with `-l debug` before this job was required: no `--log-opts` means
  # gitleaks runs `git log ... --all`, scanning every ref in the clone (fetch-depth: 0 fetches
  # all branches, not just the PR's), not only main's history. Deliberate, not an oversight --
  # /critic-gate flagged this as a real but recoverable risk (an old, unmerged branch could
  # trip an entropy rule and turn this required check red repo-wide) and a probe over full
  # history found no high-signal secret patterns. Restricting via `--log-opts` was considered
  # and rejected: getting the merge-ref `--first-parent` semantics subtly wrong risks silently
  # under-scanning the PR's own new commits, which is a worse failure than the current one --
  # and unlike F59, a false positive here IS fixable from a PR (a `.gitleaksignore` fingerprint
  # entry, same mechanism gitleaks-action itself offered).
  # -v is verbose: BR-D4 residual, recorded rather than assumed safe -- --redact covers the
  # matched secret value itself (verified against gitleaks' own source) but not the ~20 chars
  # of surrounding line context verbose mode also prints. ci.yml holds no restricted value
  # today (no ARN, no account id) so there is nothing for that context to leak; revisit if that
  # changes.
  # The digest below is pinned by content hash (immutable) but lives in a shell string, not a
  # `uses:` line -- zizmor's unpinned-uses audit and Dependabot's github-actions ecosystem
  # cannot see it, so it will not get an automated bump or vulnerability alert. Manually
  # maintained; the trailing comment is the only record of what version it resolves to.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact -v /repo # v8.30.1

  # Catches the injection and unpinned-uses/artipacked classes CLAUDE.md's GitHub Actions
  # security section names -- this is what turns "fixed once" (T1) into "can't regress."
  # zizmor-action propagates zizmor's own exit code: it fails on ANY finding at any severity
  # (no min-severity/min-confidence input is set), the same way a failing test fails `test`.
  # advanced-security: false / annotations: true -- deliberately NOT the SARIF-to-Security-tab
  # upload the action defaults to. That upload needs security-events: write, which a fork PR's
  # GITHUB_TOKEN is capped read-only regardless of what this file grants, so the default
  # config fails closed on every fork PR (found by /critic-gate on this task). Inline
  # annotations read from the job log instead, work identically for same-repo and fork PRs, and
  # need no elevated permission at all -- so this job now inherits the workflow-level
  # `contents: read` default rather than declaring its own permissions: block.
  # F60, CLOSED 2026-08-09 by S1b-T7: job-scoping deploy.yml's id-token: write (excessive-
  # permissions) and adding dependabot.yml's cooldown block closed both findings this job was
  # tripping on -- verified locally with this exact pinned image before this job was required
  # (see sprint_plan.md Task 7 and docs/hardening_roadmap.md's F60 row).
  # version: pinned rather than left at zizmor-action's own `latest` default -- found by
  # /critic-gate on this task (both security-critic and architect, independently): once this
  # job is a required check under bypass_actors: [], an unpinned tool version means a new
  # zizmor release, not a repo change, can turn every open PR unmergeable. online-audits stays
  # on (its default) and fetches live GHSA data, which is a real but accepted residual --
  # disabling it would trade required-check stability for reduced detection, a call this task
  # is not the one to make unilaterally.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: '1.29.0'
          advanced-security: false
          annotations: true
