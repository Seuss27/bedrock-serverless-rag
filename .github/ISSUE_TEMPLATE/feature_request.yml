name: ✨ Infrastructure Request
description: Request new cloud resources, namespaces, or architecture changes.
title: "[Env] Component: Brief description of requested resource"
labels: ["type/feature", "status/triage"]
body:
  - type: dropdown
    id: environment
    attributes:
      label: Target Environment
      options:
        - Production
        - Staging
        - Development
    validations:
      required: true
  - type: textarea
    id: business_case
    attributes:
      label: Business Case & Requirements
      description: Why is this infrastructure needed? Include capacity requirements if applicable.
      placeholder: "e.g., We need a new Redis cluster for the upcoming caching microservice. Expected load is 500 QPS."
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: Security & Compliance Checklist
      options:
        - label: This request complies with least-privilege access.
          required: true
        - label: No hardcoded secrets will be committed with this change.
          required: true