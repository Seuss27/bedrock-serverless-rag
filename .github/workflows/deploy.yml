name: Deploy AI Lab Infrastructure

# S1b-T2: split out of deploy-ai-lab.yml (deleted). This file is the credentialed half --
# every job below assumes an AWS role. No `pull_request` trigger exists here, deliberately
# (post-S1a reassessment, sprint_plan.md top banner): T4 (a PR-triggered plan job) is
# deferred to S2, which mints a read-only plan role first. Until then, the moment this file
# existed with a pull_request trigger it would hand an apply-capable credential to code from
# an unreviewed branch -- exactly what deleting deploy-ai-lab.yml's security-and-linting job
# (which did exactly that) was for. `push` + `workflow_dispatch` only, full stop.
on:
  push:
    branches: [main]
  # Human-triggered only -- deliberately NOT pull_request/pull_request_target/workflow_run
  # (CLAUDE.md's GitHub Actions security rules). A typed confirmation phrase is required
  # below, matched in the destroy job's own `if:` (a GitHub expression comparison, not a
  # shell command -- the phrase never reaches a `run:` block, so BR-D4/injection rules about
  # ${{ }} in `run:` don't even apply here). A wrong or missing phrase means the destroy job
  # is skipped, not failed -- visible in the run summary either way.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly "destroy-ai-lab" to destroy environments/ai-lab. Anything else skips the destroy job.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# F20/S1a-T5: two merges in quick succession must queue, not race, for the same state --
# the DynamoDB lock turns a race into a hard failure rather than a queue. `false` is
# load-bearing: cancelling an IN-PROGRESS `tofu apply` orphans the lock and leaves state
# describing a half-applied world. Note the asymmetry this does NOT cover: GitHub still
# replaces a merely-PENDING (queued, not yet started) run in this group with a newer one --
# safe for state (a pending run never took the lock) but it means a burst of 3+ merges can
# drop a middle run's apply/approval silently. Workflow-level, so `destroy-ai-lab`
# (workflow_dispatch on the same ref) shares this group too -- a destroy dispatched while an
# apply sits waiting for approval queues behind it; the operator can cancel the waiting run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # F13/F14/S1a-T5: read-only plan on push to main, split out of the old fused
  # plan-and-apply job. An Environment approval fires when a job STARTS, so a fused job
  # would ask tofu-apply's approver to sign off before any plan had run -- this job exists
  # so the approver has fresh evidence to read. No `needs:` on ci.yml's checks -- that file
  # is a separate `pull_request`-triggered workflow now, and GitHub Actions `needs:` cannot
  # span workflow files.
  # ⚠️ ci.yml's checks are NOT required checks yet -- only `pr-title` is, until T7 adds
  # them. Until then this repo's ruleset permits merging with every ci.yml job red
  # (required_approving_review_count: 0, bypass_actors: []), so the human approval on
  # tofu-apply below is, for this interval, the ONLY automated control standing in front
  # of an apply -- not a second layer behind ci.yml. Read the plan summary accordingly.
  tofu-plan-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/ai-lab
    env:
        # BR-D4 EXCEPTION, recorded in CLAUDE.md's BR-D4 section (see the identical note
        # on the credentials step in tofu-apply below): all three of these ride
        # `secrets.*`, not `vars.*`, even though none is secret by BR-D4's own definition
        # (bucket name, two role ARNs -- restricted, not PII).
        TF_VAR_data_source_bucket_name: ${{ secrets.DATA_SOURCE_BUCKET_NAME }}
        TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
        TF_VAR_data_plane_principal_arns: '["${{ secrets.AWS_OIDC_ROLE_ARN }}","${{ secrets.SSO_ADMIN_ROLE_ARN }}"]'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # F-4 defense-in-depth -- see the identical step in tofu-apply below.
      # Derived from the SAME expression passed to role-to-assume below (not hardcoded to
      # the apply role): the day S2-T2 creates AWS_PLAN_ROLE_ARN, a mask pinned to the
      # wrong role would silently mask the wrong account with no failing check.
      - name: Register bare account id for log masking
        env:
          DEPLOY_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          account_id="$(echo "$DEPLOY_ARN" | cut -d: -f5)"
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::plan role ARN did not yield a 12-digit account id -- account-id masking is NOT active"
            exit 1
          fi
          echo "::add-mask::$account_id"

      - uses: opentofu/setup-opentofu@v2

      # No read-only plan role exists yet (S2-T0 creates one) -- falls through to the
      # apply-capable role today. The `||` shape means S2-T2 flips this by creating the
      # secret, with no workflow edit.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN }} # S2-T2: drop the fallback once the upstream plan role is adopted
          aws-region: us-east-1

      - name: OpenTofu Init
        run: tofu init

      # -lock=false: a read-only plan must never take the DynamoDB lock and block a
      # concurrent apply.
      # ⚠️ `-out=` does NOT suppress stdout -- it saves the plan ADDITIONALLY, so the full
      # human-readable render (account id, role ARNs, the AOSS collection endpoint --
      # everything BR-D4 forbids) still prints unless stdout is separately silenced.
      # -no-color keeps ANSI sequences from splitting a masked value across bytes.
      - name: OpenTofu Plan
        run: tofu plan -no-color -lock=false -input=false -out=tfplan > /dev/null

      # F16/BR-D4: summarize, never dump. Resource actions and addresses only -- never an
      # attribute value, which is what the human-readable plan renders. Value-free only as
      # long as no resource here uses for_each/count (a resource's instance key rides its
      # own `.address`) -- true today (grep -rn 'for_each|count *=' finds none), not enforced.
      - name: Summarize plan
        run: |
          set -euo pipefail
          tofu show -json tfplan > plan.json
          jq -r '(.resource_changes // [])[]
                 | select(.change.actions != ["no-op"])
                 | "\(.change.actions | join(",")) \(.address)"' plan.json \
            | sort | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '[(.resource_changes // [])[] | select(.change.actions != ["no-op"])] | length
                 | "total changes: \(.)"' plan.json >> "$GITHUB_STEP_SUMMARY"

      # A plan file on a public repo's artifact store is world-readable and contains
      # everything the summary above was written to omit. No artifact is uploaded by this
      # job; deleting the files is belt-and-suspenders on an ephemeral runner.
      - name: Clean up plan files
        if: always()
        run: rm -f tfplan plan.json

  # F13/F14/F20/S1a-T5: the only control between a merge and an admin-capable apply until
  # S2 lands. Gated behind the `production` Environment -- approval fires when this job
  # STARTS, so the approver reads tofu-plan-main's just-produced summary before clicking
  # approve. What actually applies is THIS job's own plan, taken and saved fresh AFTER that
  # approval and never re-planned again (F14: what applies is what this job's own summary,
  # below, describes) -- but that is a distinct plan from the one the approver read. The gap
  # between the two is an accepted residual (sprint_plan.md's Critical Review): passing a
  # single plan file across the job boundary would need a public artifact, which BR-D4
  # forbids more directly than the residual costs.
  #
  # DECISION RECORDED (S1b-T2, 2026-08-08), answering the "decide, don't drift" item
  # .ai/next-steps.md raised: while the lab sits deliberately torn down, EVERY merge --
  # docs-only ones included -- plans "12 to add" and needs a manual REJECT rather than a
  # rubber-stamp approve, which is new approval fatigue the S1a design didn't anticipate.
  # Kept as-is (option "accept the noise"): no zero-changes short-circuit, no
  # workflow_dispatch-only gating while torn down. A skip-on-no-changes would reduce how
  # often this gate is exercised -- the exact regression the sprint plan's own banner
  # warns against -- and BR-D2 is unaffected either way (a human still reads a plan before
  # anything reaches AWS). Revisit if approval fatigue becomes a real habit-forming risk.
  tofu-apply:
    needs: tofu-plan-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/ai-lab
    env:
        TF_VAR_data_source_bucket_name: ${{ secrets.DATA_SOURCE_BUCKET_NAME }}
        TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
        # MW-T6. The AOSS access policy's Principal list is fully declarative, so CI must
        # supply the SAME set of ARNs a local admin-SSO apply does (this job's own deploy
        # role, secrets.AWS_OIDC_ROLE_ARN -- already an IAM role ARN, it's what
        # role-to-assume takes below -- PLUS the human operator's SSO role) or CI's apply
        # silently overwrites live state down to one principal, revoking local data-plane
        # access until the next local apply restores it.
        TF_VAR_data_plane_principal_arns: '["${{ secrets.AWS_OIDC_ROLE_ARN }}","${{ secrets.SSO_ADMIN_ROLE_ARN }}"]'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # F-4 defense-in-depth: GitHub's log masking is exact-literal substring matching, so
      # masking the full role ARN does not also mask the bare account id if it appears in
      # a DIFFERENTLY-shaped string later -- e.g. an assumed-role ARN
      # (arn:aws:sts::<acct>:assumed-role/<role>/<session>) in an AWS error message is a
      # different string than the plain IAM role ARN, even though both share the account
      # id substring. Deriving and masking the bare id separately closes that gap for
      # every ARN shape at once.
      - name: Register bare account id for log masking
        env:
          DEPLOY_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          account_id="$(echo "$DEPLOY_ARN" | cut -d: -f5)"
          # Fail loudly rather than silently skip: an empty/malformed account id means
          # this defense-in-depth control did NOT register, and a green step here must
          # not be readable as "masking is active" when it isn't (F48's own lesson --
          # a control whose only evidence is a step that also passes when it did nothing
          # is indistinguishable from a miss).
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_OIDC_ROLE_ARN did not yield a 12-digit account id -- account-id masking is NOT active"
            exit 1
          fi
          echo "::add-mask::$account_id"

      # create_index.py runs via a local-exec provisioner during apply -- its deps must be
      # installed before OpenTofu reaches that resource. This job also holds the
      # admin-capable credential while running that third-party pip install, so the
      # checkout above drops the GITHUB_TOKEN rather than leave it for that code to find.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: environments/ai-lab/requirements.txt
      - run: pip install -r requirements.txt

      - uses: opentofu/setup-opentofu@v2

      # BR-D4 EXCEPTION, recorded: this role ARN rides `secrets.*`, not `vars.*`, even
      # though it is restricted-not-secret by BR-D4's own definition. Measured live
      # 2026-08-07 (run 31226198865, deleted after capture): GitHub Actions dumps every
      # `with:`/`env:` value from `vars.*` into the auto-generated step preamble it prints
      # for EVERY step -- `uses:` steps included -- with no way to suppress or mask it
      # after the fact. Only `secrets.*` is auto-masked, everywhere, unconditionally. On
      # GitHub specifically, "restricted, use a variable" and "never in a workflow log"
      # are in direct conflict; this is the one place BR-D4's stated split does not hold,
      # and secrets.* is the only mechanism that delivers what BR-D4 actually wants here.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: OpenTofu Init
        run: tofu init -get=true

      # -lock-timeout=5m rather than -lock=false: this job DOES need the write lock (it
      # applies), so a concurrent operation (realistically, a local admin-SSO apply -- the
      # concurrency group above already excludes sibling CI runs) should make it wait
      # briefly, not fail outright. Same redirect rationale as tofu-plan-main's plan step.
      - name: OpenTofu Plan
        run: tofu plan -no-color -input=false -lock-timeout=5m -out=tfplan > /dev/null

      - name: Summarize plan
        run: |
          set -euo pipefail
          tofu show -json tfplan > plan.json
          jq -r '(.resource_changes // [])[]
                 | select(.change.actions != ["no-op"])
                 | "\(.change.actions | join(",")) \(.address)"' plan.json \
            | sort | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '[(.resource_changes // [])[] | select(.change.actions != ["no-op"])] | length
                 | "total changes: \(.)"' plan.json >> "$GITHUB_STEP_SUMMARY"

      # Applies the EXACT plan saved above, not a fresh re-plan (F14) -- what gets applied
      # is what THIS job's own summary just described (see the job-level comment above for
      # the residual gap between this plan and the one the approver actually read).
      # -lock-timeout=5m again: the plan step above released the lock before this step
      # re-takes it, so the same brief-wait reasoning applies here, one step later.
      # -auto-approve is permitted here because the Environment approval already happened
      # (BR-D2). CLAUDE.md: permitted in exactly two places in this repo and nowhere else --
      # here, and on destroy-ai-lab below (gated instead by its typed confirm phrase).
      - name: OpenTofu Apply
        run: tofu apply -input=false -lock-timeout=5m -auto-approve tfplan

      # Same rationale as tofu-plan-main's cleanup step.
      - name: Clean up plan files
        if: always()
        run: rm -f tfplan plan.json

  # MW-T6: the "destroy" half of the destroy -> apply -> RetrieveAndGenerate cycle. Runs
  # ONLY on a manual dispatch from `main` with the exact confirm phrase (see the on:
  # workflow_dispatch block above); any other event, ref, or phrase leaves this job skipped.
  # A human watches the run live rather than firing it unattended, per the MW sprint plan's
  # Critical review. Carried across BYTE-IDENTICAL from deploy-ai-lab.yml (S1b-T2 planning
  # decision 2) -- including keeping the `name:` key. Deliberately NOT behind
  # `environment: production`: GitHub permits self-approval on Environments, so on a
  # one-maintainer repo it would buy zero independent review while changing this job's OIDC
  # subject. The typed confirm phrase plus a human watching the run live is the accepted
  # control; revisit on a second maintainer (BR-D25). `workflow_dispatch`-only, so it can
  # never become a required check -- F18's name:-override rule does not bind it, and the
  # human-readable name is worth having in the dispatch UI.
  destroy-ai-lab:
    name: Destroy AI Lab Infrastructure (manual)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirm == 'destroy-ai-lab'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/ai-lab
    env:
      # Same BR-D4 secrets.* exception as tofu-apply above -- see its env: block comment
      # for the measured reason.
      TF_VAR_data_source_bucket_name: ${{ secrets.DATA_SOURCE_BUCKET_NAME }}
      TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
      TF_VAR_data_plane_principal_arns: '["${{ secrets.AWS_OIDC_ROLE_ARN }}","${{ secrets.SSO_ADMIN_ROLE_ARN }}"]'
    steps:
      - uses: actions/checkout@v7

      # F-4 defense-in-depth -- identical to the same step in the other jobs.
      - name: Register bare account id for log masking
        env:
          DEPLOY_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          account_id="$(echo "$DEPLOY_ARN" | cut -d: -f5)"
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_OIDC_ROLE_ARN did not yield a 12-digit account id -- account-id masking is NOT active"
            exit 1
          fi
          echo "::add-mask::$account_id"

      - uses: opentofu/setup-opentofu@v2

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: OpenTofu Init
        run: tofu init -get=true

      # Same BR-D4/F16 summarization pattern as the plan jobs above: stdout redirected,
      # only resource addresses and change counts printed, no attribute values.
      - id: destroy-plan
        run: |
          set -euo pipefail
          tofu plan -destroy -no-color -input=false -out=tfplan > /dev/null
          echo "::group::Destroy plan summary (BR-D4 -- resource addresses and change counts only, no attribute values)"
          summary="$(tofu show -no-color tfplan)"
          printf '%s\n' "$summary" | grep -E '^(Plan:|No changes\.|  # )' || [ "$?" -eq 1 ]
          echo "::endgroup::"

      # Applies the exact destroy plan saved above. -auto-approve is required (no TTY on a
      # hosted runner); the human approval this repo requires (BR-D2) is the act of
      # dispatching this job with the correct confirm phrase, plus watching this run live
      # per the MW sprint plan -- the same accepted-gap shape as tofu-apply's own
      # -auto-approve path (F13, fixed by S1a-T5, out of scope for this job).
      - name: OpenTofu Destroy
        run: tofu apply -auto-approve -input=false tfplan
