name: 🔐 Access / IAM Request
description: Request a new service account, RBAC change, or secret rotation.
labels: ["chore", "status/triage"]
body:
  - type: input
    id: entity
    attributes:
      label: Target Entity
      description: Who or what needs access? (e.g., github-actions-runner, data-science-team)
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Requested Permissions
      description: >-
        Specify the exact roles, namespaces, or resources needed. This repo is public --
        do not paste the account id or a full role ARN; name the role/resource instead.
    validations:
      required: true
