name: 🐛 Infrastructure Bug / Incident
description: Report a broken service, deployment failure, or misconfiguration.
labels: ["bug", "status/triage"]
body:
  - type: dropdown
    id: environment
    attributes:
      label: Target Environment
      description: Which environment is experiencing this issue?
      options:
        - ai-lab
        - global
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms & Impact
      description: What is failing? How is this impacting the system or users?
      placeholder: "e.g., The ingress controller is returning 502 Bad Gateway for all /api routes."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Error Messages
      description: >-
        Paste relevant logs, metric graphs, or command outputs. This repo is public --
        redact the account id, role ARNs, bucket names, and the AOSS collection endpoint
        before pasting; never paste raw `tofu plan` output.
      render: shell
