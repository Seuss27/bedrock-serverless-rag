name: Deploy AI Lab Infrastructure

on:
  push:
    branches: [main]
    paths: ['environments/ai-lab/**', 'modules/**']
  pull_request:
    branches: [main]
    paths: ['environments/ai-lab/**', 'modules/**']

permissions:
  id-token: write
  contents: read

jobs:
  security-and-linting:
    name: Security & Linting Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/ai-lab
    steps:
      - uses: actions/checkout@v7

      # F-4 defense-in-depth: GitHub's log masking is exact-literal substring matching, so
      # masking the full role ARN does not also mask the bare account id if it appears in
      # a DIFFERENTLY-shaped string later -- e.g. an assumed-role ARN
      # (arn:aws:sts::<acct>:assumed-role/<role>/<session>) in an AWS error message is a
      # different string than the plain IAM role ARN, even though both share the account
      # id substring. Deriving and masking the bare id separately closes that gap for
      # every ARN shape at once. Safe via `env:` here (unlike the vars.* case elsewhere in
      # this file) because secrets.* IS masked in this step's own preamble too -- proven
      # in the same measured run the BR-D4 exception notes below are about.
      - name: Register bare account id for log masking
        env:
          DEPLOY_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          account_id="$(echo "$DEPLOY_ARN" | cut -d: -f5)"
          # Fail loudly rather than silently skip: an empty/malformed account id means
          # this defense-in-depth control did NOT register, and a green step here must
          # not be readable as "masking is active" when it isn't (F48's own lesson --
          # a control whose only evidence is a step that also passes when it did nothing
          # is indistinguishable from a miss).
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_OIDC_ROLE_ARN did not yield a 12-digit account id -- account-id masking is NOT active"
            exit 1
          fi
          echo "::add-mask::$account_id"

      - uses: opentofu/setup-opentofu@v2

      # Runs before AWS credentials exist in this job's environment: neither pip nor
      # ruff/bandit need them, and a `pull_request`-triggered job's `pip install` is
      # untrusted-dependency-execution surface -- don't hand it a live credential for
      # free. See CLAUDE.md's GitHub Actions security section.
      - name: Python Security & Linting
        uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: |
          pip install ruff==0.16.2 bandit==1.9.4
          ruff check .
          bandit -r .

      # CONFIGURE CREDENTIALS FIRST (of the AWS-dependent steps below)
      # This provides the necessary OIDC tokens for the S3 backend to initialize
      #
      # BR-D4 EXCEPTION, recorded: this role ARN rides `secrets.*`, not `vars.*`, even
      # though it is restricted-not-secret by BR-D4's own definition. Measured live
      # 2026-08-07 (run 31226198865, deleted after capture): GitHub Actions dumps every
      # `with:`/`env:` value from `vars.*` into the auto-generated step preamble it prints
      # for EVERY step -- `uses:` steps included -- with no way to suppress or mask it
      # after the fact. Only `secrets.*` is auto-masked, everywhere, unconditionally. On
      # GitHub specifically, "restricted, use a variable" and "never in a workflow log"
      # are in direct conflict; this is the one place BR-D4's stated split does not hold,
      # and secrets.* is the only mechanism that delivers what BR-D4 actually wants here.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: OpenTofu Init
        run: tofu init

      - name: OpenTofu Checks
        run: |
          tofu fmt -check -recursive ../../
          tofu validate

      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ../../modules
          framework: terraform
          quiet: true

  opentofu-pipeline:
    name: OpenTofu Plan & Apply
    needs: security-and-linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/ai-lab
    env:
        # BR-D4 EXCEPTION, recorded in CLAUDE.md's BR-D4 section (see the identical note
        # on the credentials step in security-and-linting above): all three of these ride
        # `secrets.*`, not `vars.*`, even though none is secret by BR-D4's own definition
        # (bucket name, two role ARNs -- restricted, not PII). Measured live 2026-08-07
        # (run 31226198865, deleted after capture): a `vars.*` value used anywhere in a
        # job -- `env:`, `with:`, doesn't matter -- prints in cleartext in the
        # auto-generated preamble GitHub emits for EVERY step, `uses:` steps included,
        # with no way to register it for masking before that first dump happens (the
        # dump itself happens before any of this job's own script logic runs at all, so
        # no step ordering fixes it). Only `secrets.*` is masked unconditionally,
        # everywhere, from the first step onward -- proven in the same leaked run, where
        # the one value already on `secrets.*` (below) rendered as `***` throughout while
        # everything on `vars.*` did not. This is the sole mechanism that delivers what
        # BR-D4 actually wants for a value that must not reach a workflow log.
        TF_VAR_data_source_bucket_name: ${{ secrets.DATA_SOURCE_BUCKET_NAME }}
        # PII (BR-D4), so this rides a secret, not a variable -- a repo `vars.*` value
        # renders in cleartext anywhere it's echoed. Requires the BUDGET_NOTIFICATION_EMAIL
        # repository secret to be set (S0-T8); until then this job's plan step fails on
        # "No value for required variable", same as any other missing required input.
        TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
        # MW-T6. The AOSS access policy's Principal list is fully declarative, so CI must
        # supply the SAME set of ARNs a local admin-SSO apply does (this job's own deploy
        # role, secrets.AWS_OIDC_ROLE_ARN -- already an IAM role ARN, it's what
        # role-to-assume takes above -- PLUS the human operator's SSO role) or CI's apply
        # silently overwrites live state down to one principal, revoking local data-plane
        # access until the next local apply restores it. Constructed as an HCL list
        # literal via GitHub Actions' own string interpolation so neither ARN ever has to
        # be typed, read, or printed anywhere in this file or a session transcript.
        TF_VAR_data_plane_principal_arns: '["${{ secrets.AWS_OIDC_ROLE_ARN }}","${{ secrets.SSO_ADMIN_ROLE_ARN }}"]'
    steps:
      - uses: actions/checkout@v7

      # F-4 defense-in-depth -- see the identical step and comment in security-and-linting
      # above. Registered per-job (masks don't cross the job boundary) and again as early
      # as possible: the AOSS/Bedrock/S3 calls below are exactly where an AccessDenied
      # would render an assumed-role ARN, a different string than the plain role ARN.
      - name: Register bare account id for log masking
        env:
          DEPLOY_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          set -euo pipefail
          account_id="$(echo "$DEPLOY_ARN" | cut -d: -f5)"
          # Fail loudly rather than silently skip: an empty/malformed account id means
          # this defense-in-depth control did NOT register, and a green step here must
          # not be readable as "masking is active" when it isn't (F48's own lesson --
          # a control whose only evidence is a step that also passes when it did nothing
          # is indistinguishable from a miss).
          if [[ ! "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_OIDC_ROLE_ARN did not yield a 12-digit account id -- account-id masking is NOT active"
            exit 1
          fi
          echo "::add-mask::$account_id"

      # 1. Setup Python
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: environments/ai-lab/requirements.txt
      - run: pip install -r requirements.txt
      
      # 2. Setup OpenTofu
      - uses: opentofu/setup-opentofu@v2
      
      # 3. CONFIGURE CREDENTIALS FIRST
      # This provides the necessary OIDC tokens for the S3 backend to initialize
      # BR-D4 EXCEPTION -- secrets.*, not vars.*; see the note on this job's own `env:`
      # block above.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
      
      # 4. Now initialize. Because credentials exist, the S3 backend will work.
      - name: OpenTofu Init
        run: tofu init -get=true
      
      # 5. Plan and Apply
      # -input=false: a missing required variable must fail the run, not block it waiting
      # for a TTY that a GitHub-hosted runner never provides -- an unattended hang holds
      # the state lock until GitHub's own job timeout, blocking every other tofu operation
      # against this state in the meantime.
      #
      # F16/BR-D4: `tofu plan` renders every known attribute, including ARNs, the account
      # id and the AOSS collection endpoint, into a public workflow log if dumped raw.
      # ⚠️ `-out=` does NOT suppress stdout -- it saves the plan ADDITIONALLY, so the full
      # human-readable render still prints unless stdout is separately silenced. Redirect
      # stdout only (diagnostics go to stderr, so a real plan failure still surfaces); the
      # filename `tfplan` matches the exact name .gitignore already reserves for this
      # purpose (F54) -- `tfplan.bin` would NOT be ignored and is one `git add -A` from
      # publishing every value this redirect exists to withhold. The `  # ` allowlist below
      # is value-free only as long as no resource in this repo uses for_each/count (a
      # resource's instance key rides its address line) -- true today (grep -rn
      # 'for_each|count *=' finds none), not enforced. S1-T4 owns building the real
      # summarizer (`tofu show -json` + jq, format-drift-proof); this is a stopgap for
      # MW-T6, not that task done early.
      - id: plan
        run: |
          set -euo pipefail
          tofu plan -no-color -input=false -out=tfplan > /dev/null
          echo "::group::Plan summary (BR-D4 -- resource addresses and change counts only, no attribute values)"
          # A `tofu show` failure must abort the step (set -e on the assignment), which is
          # NOT the same thing as grep matching nothing -- the two failure modes are kept
          # separate here on purpose (a bare `... | grep ... || true` after `-o pipefail`
          # would swallow both identically and let a broken plan look like a clean one).
          summary="$(tofu show -no-color tfplan)"
          printf '%s\n' "$summary" | grep -E '^(Plan:|No changes\.|  # )' || [ "$?" -eq 1 ]
          echo "::endgroup::"

      # Applies the EXACT plan saved above, not a fresh re-plan -- what gets applied is
      # what the summary above described (closes F14's "re-plans rather than applying a
      # saved plan" gap as a side effect of the F16 fix, not a separate change).
      - name: OpenTofu Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tofu apply -auto-approve -input=false tfplan
  