name: ⚠️ GitOps Sync Failure / Drift
description: The deployment agent failed to apply manifests, or drift was detected.
title: "[Env] Sync Failure: Application or Component Name"
labels: ["type/sync-failure", "status/triage"]
body:
  - type: input
    id: app_name
    attributes:
      label: Application / Release Name
      description: The name of the ArgoCD app, Flux Kustomization, or Helm Release.
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Agent Error Output
      description: Paste the exact validation error or failure reason from the GitOps agent.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: resolution_path
    attributes:
      label: Proposed Resolution Path
      options:
        - Update Git repository to match desired state
        - Delete drifted cloud resource to allow GitOps agent to recreate
        - Needs investigation